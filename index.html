f<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Nedtelling</title>

<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">

<style>
body{
    margin:0;
    background:#efefef;
    height:100vh;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.wrapper{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#title{
    margin-top:26vh;
    height:62px; /* fast høyde for å unngå hopping */
    font-size:52px;
    font-weight:400;
    text-align:center;
    color:#000;
}

#undertitle{
    margin-top:5vh;
    height:62px; /* fast høyde for å unngå hopping */
    font-size:52px;
    font-weight:400;
    text-align:center;
    color:#000;
}

#timer{
    margin-top:90px;
    font-family:'DS-Digital', monospace;
    font-size:140px;
    color:#000;
    letter-spacing:8px;
}
</style>
</head>
<body>

<div class="wrapper">
    <div id="title"></div>
    <div id="undertitle">【SPILLET ER I FERD MED Å BEGYNNE】</div>
    <div id="timer">00:30</div>
</div>

<script>
let phase = 1;
let remaining = 30;

const titleEl = document.getElementById("title");
const undertitleEl = document.getElementById("undertitle");
const timerEl = document.getElementById("timer");

function formatTime(seconds){
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateTimer(){
    timerEl.textContent = formatTime(Math.max(0, remaining));

    // Vis 00:00 i ett helt sekund
    if (remaining === 0){
        remaining = -1;
        return;
    }

    if (remaining === -1){

        if (phase === 1){
            phase = 2;
            remaining = 30;
            titleEl.textContent = "【Spill】";
            undertitleEl.textContent = "BINGO";
            timerEl.textContent = formatTime(remaining);
            remaining--;
            return;
        }

        if (phase === 2){
            phase = 3;
            remaining = 30;
            titleEl.textContent = "";
            undertitleEl.textContent = "【FORFLYTT TIL NESTE ROM...】";
            timerEl.textContent = formatTime(remaining);
            remaining--;
            return;
        }

        phase = 1;
        remaining = 30;
        titleEl.textContent = "";
        undertitleEl.textContent = "【SPILLET ER I FERD MED Å BEGYNNE】";
        timerEl.textContent = formatTime(remaining);
        remaining--;
        return;
    }

    remaining--;
}

updateTimer();
let loop = setInterval(updateTimer, 1000);
</script>

</body>
</html>
