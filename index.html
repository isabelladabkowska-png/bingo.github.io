<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo Nedtelling</title>

<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    background:#fff;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100svh;
    overflow:hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.wrapper{
    width:100vw;
    min-height:100vh;
    min-height:100svh;
    padding:env(safe-area-inset-top) 5vw env(safe-area-inset-bottom);
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#fff;
}

#title,
#undertitle{
    width:100%;
    min-height:clamp(28px, 7.2vw, 62px);
    font-size:clamp(18px, 4.8vw, 52px);
    line-height:1.2;
    font-weight:400;
    text-align:center;
    color:#000;
    white-space:nowrap;
}

#title{
    margin-top:26vh;
}

#undertitle{
    margin-top:5vh;
}

#timer{
    margin-top:clamp(38px, 8.2vh, 90px);
    font-family:'DS-Digital', monospace;
    font-size:clamp(54px, 15.5vw, 140px);
    line-height:1;
    color:#000;
    letter-spacing:clamp(2px, 0.9vw, 8px);
    white-space:nowrap;
}

@media (max-width: 600px){
    .wrapper{
        padding-left:4vw;
        padding-right:4vw;
    }

    #title{
        margin-top:38vh;
    }

    #undertitle{
        margin-top:0;
        font-size:clamp(16px, 4.55vw, 34px);
    }

    #timer{
        margin-top:5vh;
        font-size:clamp(54px, 16.5vw, 84px);
        letter-spacing:clamp(2px, 1vw, 5px);
    }
}

@media (max-width: 360px){
    #undertitle{
        font-size:clamp(18px, 4.95vw, 22px);
    }

    #timer{
        font-size:clamp(50px, 15.5vw, 60px);
    }
}
</style>
</head>
<body>

<div class="wrapper">
    <div id="title"></div>
    <div id="undertitle">【SPILLET ER I FERD MED Å BEGYNNE】</div>
    <div id="timer">00:30</div>
</div>

<script>
let phase = 1;
let remaining = 30;

const titleEl = document.getElementById("title");
const undertitleEl = document.getElementById("undertitle");
const timerEl = document.getElementById("timer");

function formatTime(seconds){
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateTimer(){
    timerEl.textContent = formatTime(Math.max(0, remaining));

    // Vis 00:00 i ett helt sekund
    if (remaining === 0){
        remaining = -1;
        return;
    }

    if (remaining === -1){

        if (phase === 1){
            phase = 2;
            remaining = 30;
            titleEl.textContent = "【Spill】";
            undertitleEl.textContent = "BINGO";
            timerEl.textContent = formatTime(remaining);
            remaining--;
            return;
        }

        if (phase === 2){
            phase = 3;
            remaining = 30;
            titleEl.textContent = "";
            undertitleEl.textContent = "【FORFLYTT TIL NESTE ROM...】";
            timerEl.textContent = formatTime(remaining);
            remaining--;
            return;
        }

        phase = 1;
        remaining = 30;
        titleEl.textContent = "";
        undertitleEl.textContent = "【SPILLET ER I FERD MED Å BEGYNNE】";
        timerEl.textContent = formatTime(remaining);
        remaining--;
        return;
    }

    remaining--;
}

updateTimer();
let loop = setInterval(updateTimer, 1000);
</script>

</body>
</html>
